spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=vanoiseee;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator: expose only health/info for container orchestration; everything
# else stays closed (default) to avoid leaking internals.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Mail server reachability is not a liveness/readiness concern for this app
# (a transient SMTP outage must not make the orchestrator restart the pod).
management.health.mail.enabled=false

# --- RASP (Runtime Application Self-Protection) ---------------------------
# See com.tn.gias.transport.rasp and README-DEVSECOPS.md > "Runtime Security (RASP)"
rasp.enabled=${RASP_ENABLED:true}
rasp.mode=${RASP_MODE:block}
rasp.log-dir=${RASP_LOG_DIR:./rasp-logs}
rasp.ssrf.allowed-hosts=${RASP_SSRF_ALLOWED_HOSTS:}
rasp.demo.enabled=${RASP_DEMO_ENABLED:false}
