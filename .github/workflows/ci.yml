name: Backend CI/DevSecOps

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  IMAGE_NAME: ghcr.io/khawlaguizani/backend
  DC_DATA_DIR: ${{ github.workspace }}/.dependency-check-data

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:

  # ============================================================
  # 1. BUILD + TEST + SONARCLOUD
  # ============================================================
  build-test-sonar:
    name: Build, Test & SonarCloud
    runs-on: self-hosted

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build, run unit tests and generate JaCoCo coverage
        run: ./mvnw -B clean verify

      - name: Publish JUnit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend JUnit Results
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=khawlaGuizani_Backend \
            -Dsonar.organization=khawlaguizani \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports

      - name: Skip SonarCloud
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::warning::SONAR_TOKEN secret is not set — skipping SonarCloud analysis."

      - name: Upload JUnit & JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-jacoco-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          retention-days: 30

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7


  # ============================================================
  # 2. GITLEAKS - SECRET SCANNING
  # ============================================================
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          mkdir -p reports/gitleaks

          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/security/gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format sarif \
            --report-path /repo/reports/gitleaks/gitleaks.sarif \
            --redact \
            --verbose \
            --exit-code 1

      - name: Generate human-readable Gitleaks report
        if: always()
        run: |
          mkdir -p reports/gitleaks

          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/security/gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format json \
            --report-path /repo/reports/gitleaks/gitleaks.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('reports/gitleaks/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks/gitleaks.sarif
          category: gitleaks

      - name: Upload Gitleaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: reports/gitleaks/**
          retention-days: 30


  # ============================================================
  # 3. OWASP DEPENDENCY-CHECK
  # ============================================================
  dependency-check:
    name: Dependency Scan (OWASP Dependency-Check)
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: dependency-check-db-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-db-${{ runner.os }}-
            dependency-check-db-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=""

          if [ -n "$NVD_API_KEY" ]; then
            NVD_ARGS="-DnvdApiKey=${NVD_API_KEY}"
          fi

          ./mvnw -B org.owasp:dependency-check-maven:12.2.2:check \
            -DdataDirectory=${{ env.DC_DATA_DIR }} \
            -DsuppressionFiles=security/dependency-check-suppressions.xml \
            -Dformats=HTML,JSON,SARIF \
            -DfailBuildOnCVSS=11 \
            -DassemblyAnalyzerEnabled=false \
            $NVD_ARGS

      - name: Upload Dependency-Check SARIF
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-reports
          path: target/dependency-check-report.*
          retention-days: 30


  # ============================================================
  # 4. SEMGREP - SAST
  # ============================================================
  semgrep:
    name: SAST (Semgrep)
    runs-on: self-hosted

    container:
      image: semgrep/semgrep

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep.yml \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif \
            --error || true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-semgrep-report
          path: semgrep-results.sarif
          retention-days: 30


  # ============================================================
  # 5. LICENSE SCAN
  # ============================================================
  license-scan:
    name: License Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Generate third-party license report
        run: |
          ./mvnw -B \
            org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-third-party-report \
            -Dlicense.outputDirectory=target/licenses

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-license-report
          path: target/licenses/**
          retention-days: 30

#-------------------
  # ============================================================
  # 6. DOCKER BUILD + TRIVY + SYFT + GRYPE
  # ============================================================
  docker-image-security:
    name: Docker Build & Image Security
    runs-on: self-hosted

    needs:
      - build-test-sonar
      - gitleaks

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================
      # TRIVY CACHE
      # ========================================================
      - name: Cache Trivy
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            trivy-${{ runner.os }}-
            trivy-

      # ========================================================
      # TRIVY SARIF
      # ========================================================
      - name: Trivy scan - SARIF
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          scanners: vuln
          timeout: 30m
          exit-code: '0'

      # ========================================================
      # TRIVY HTML
      # ========================================================
      - name: Download Trivy HTML template
        run: |
          mkdir -p contrib

          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o contrib/html.tpl

      - name: Trivy scan - HTML report
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: template
          template: '@contrib/html.tpl'
          output: trivy-report.html
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          scanners: vuln
          timeout: 30m
          exit-code: '0'

      # ========================================================
      # TRIVY CRITICAL - INFORMATION ONLY
      # ========================================================
      - name: Trivy scan - CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln
          timeout: 30m
          exit-code: '0'

      # ========================================================
      # UPLOAD TRIVY SARIF
      # ========================================================
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-backend-image

      # ========================================================
      # SBOM
      # ========================================================
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-backend.cyclonedx.json

      # ========================================================
      # GRYPE
      # ========================================================
      - name: Scan SBOM for vulnerabilities (Grype)
        id: grype
        uses: anchore/scan-action@v6
        continue-on-error: true
        with:
          sbom: sbom-backend.cyclonedx.json
          fail-build: false
          severity-cutoff: high

      # ========================================================
      # UPLOAD CONTAINER SECURITY REPORTS
      # ========================================================
      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-container-security-reports
          path: |
            trivy-results.sarif
            trivy-report.html
            sbom-backend.cyclonedx.json
            ${{ steps.grype.outputs.sarif }}
          retention-days: 30

      # ========================================================
      # GHCR LOGIN
      # ========================================================
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # PUSH IMAGE
      # ========================================================
      - name: Push image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 7. SECURITY GATE
  # ============================================================
  security-gate:
    name: Security Gate
    runs-on: self-hosted

    if: always()

    needs:
      - build-test-sonar
      - gitleaks
      - dependency-check
      - semgrep
      - license-scan
      - docker-image-security

    env:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

    steps:

      - name: Evaluate security gate
        run: |
          echo "============================================"
          echo "          SECURITY GATE RESULTS"
          echo "============================================"

          echo "Build/Test : ${{ needs.build-test-sonar.result }}"
          echo "Gitleaks   : ${{ needs.gitleaks.result }}"
          echo "Dependency : ${{ needs.dependency-check.result }}"
          echo "Semgrep    : ${{ needs.semgrep.result }}"
          echo "License    : ${{ needs.license-scan.result }}"
          echo "Trivy      : ${{ needs.docker-image-security.result }}"

          echo "============================================"

          if [ "${{ needs.build-test-sonar.result }}" != "success" ]; then
            echo "::error::Build or tests failed."
            exit 1
          fi

          if [ "${{ needs.gitleaks.result }}" != "success" ]; then
            echo "::error::Secret scanning failed."
            exit 1
          fi

          echo "Security gate passed."
          echo "Security findings are available in GitHub artifacts."


      - name: Trigger deployment
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/devsecops-platform/dispatches" \
            -d '{"event_type":"security-gate-passed"}'


  # ============================================================
  # 8. DEPLOYMENT K3S
  # ============================================================
  deploy:
    name: Deploy to K3s
    runs-on: self-hosted

    needs:
      - security-gate

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:

      - name: Deploy backend to K3s
        run: |
          echo "============================================"
          echo "        DEPLOYMENT TO K3S"
          echo "============================================"

          kubectl rollout restart deployment/transport-backend \
            -n transport

          kubectl rollout restart deployment/transport-frontend \
            -n transport

          kubectl rollout status deployment/transport-backend \
            -n transport \
            --timeout=120s

          kubectl rollout status deployment/transport-frontend \
            -n transport \
            --timeout=120s

          echo "============================================"
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "============================================"


  # ============================================================
  # 9. DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST — OWASP ZAP
    runs-on: self-hosted

    needs:
      - deploy

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    continue-on-error: true

    steps:

      - name: Prepare ZAP reports
        run: |
          mkdir -p zap-reports
          rm -f zap-reports/*

      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm \
            --network host \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://192.168.205.150 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md || true

      - name: Verify ZAP reports
        if: always()
        run: |
          echo "============================================"
          echo "             ZAP REPORTS"
          echo "============================================"

          ls -lh zap-reports/ || true

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dast-zap-reports
          psath: zap-reports/
          retention-days: 100
