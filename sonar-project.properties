# SonarCloud configuration for the Backend (Spring Boot) project.
# In CI, these values are also passed as -D flags to the sonar-maven-plugin
# (see .github/workflows/ci.yml) which takes precedence; this file lets you
# run `sonar-scanner` locally with the same configuration.

sonar.organization=khawlaguizani
sonar.projectKey=khawlaGuizani_Backend
sonar.projectName=Transport - Backend
sonar.host.url=https://sonarcloud.io

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

sonar.exclusions=**/target/**,**/*.properties,**/rasp-logs/**
sonar.test.exclusions=**/target/**

sonar.sourceEncoding=UTF-8
